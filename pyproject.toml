[project]
name = "frankie"
version = "0.1.0"
description = "FRANKIE: the kill-test bench and, later, Frankie itself (see charter/)."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "numpy",
]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/world",
    "src/mind",
    "src/baselines",
    "src/twins",
    "src/test_fixtures",
    "src/harness",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
