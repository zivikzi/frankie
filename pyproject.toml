[project]
name = "frankie"
version = "0.1.0"
description = "FRANKIE: the kill-test bench and, later, Frankie itself (see charter/)."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "numpy",
]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

# The build backend and its own requirements are pinned too, and uv records
# these pins in uv.lock, so `uv sync --locked` builds the same install
# everywhere (I05).
[tool.uv]
build-constraint-dependencies = [
    "hatchling==1.32.4",
    "packaging==26.3",
    "pathspec==1.1.1",
    "pluggy==1.7.0",
    "tomlkit==0.15.2",
    "trove-classifiers==2026.9.21.13",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/world",
    "src/mind",
    "src/baselines",
    "src/twins",
    "src/test_fixtures",
    "src/harness",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"
